name: macOS
on:
  workflow_dispatch:
    inputs:
      duration:
        description: '整个作业时长(分钟)'
        type: choice
        default: '60'
        options: ['15', '30', '60', '120', '240', '300', '360']
      warp_enabled:
        description: 'Warpscout 代理模式'
        type: choice
        default: 'proxy'
        options: ['off', 'proxy']

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: ${{ fromJSON(inputs.duration) }}
    env:
      KRYVA_API_KEY: ${{ secrets.KRYVA_API_KEY || vars.KRYVA_API_KEY }}
      KRYVA_API_URL: ${{ secrets.KRYVA_API_URL || vars.KRYVA_API_URL }}
      PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
      RUSTDESK_ID_SERVER: ${{ secrets.RUSTDESK_ID_SERVER || vars.RUSTDESK_ID_SERVER }}
      RUSTDESK_RELAY_SERVER: ${{ secrets.RUSTDESK_RELAY_SERVER || vars.RUSTDESK_RELAY_SERVER }}
      RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY || vars.RUSTDESK_KEY }}
      RUSTDESK_ALWAYS_RELAY: ${{ secrets.RUSTDESK_ALWAYS_RELAY || vars.RUSTDESK_ALWAYS_RELAY }}
      WARPSCOUT_COUNTRY: ${{ secrets.WARPSCOUT_COUNTRY || vars.WARPSCOUT_COUNTRY }}
      WARP_ENABLED: ${{ inputs.warp_enabled }}

    steps:
      - name: Record job start
        shell: bash
        run: printf 'JOB_STARTED_AT=%s\n' "$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        shell: bash
        run: bash ./scripts/mac.sh

      - name: Keep alive
        shell: bash
        run: caffeinate -dimsu bash ./scripts/keep_alive.sh macos ${{ inputs.duration }}

      - name: Stop desktop and Warpscout proxy
        if: ${{ always() }}
        shell: bash
        run: bash ./scripts/mac.sh cleanup

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2
