trigger: none

parameters:
  - name: duration
    displayName: 整个作业时长(分钟)
    type: number
    default: 60
    values: [15, 30, 60, 120, 240, 300, 360]
  - name: warp_enabled
    displayName: Warpscout 代理模式
    type: string
    default: 'proxy'
    values: ['off', 'proxy']

jobs:
  - job: mac
    displayName: macOS
    timeoutInMinutes: ${{ parameters.duration }}
    pool:
      vmImage: macOS-latest
    variables:
      - group: remote-desktop
      - name: WARP_ENABLED
        value: ${{ parameters.warp_enabled }}
    steps:
      - bash: |
          printf '##vso[task.setvariable variable=JOB_STARTED_AT]%s\n' "`date -u +%s`"
        displayName: Record job start

      - checkout: self

      - bash: bash ./scripts/mac.sh
        displayName: Prepare RustDesk, Warpscout and browser
        env:
          KRYVA_API_KEY: $(KRYVA_API_KEY)
          KRYVA_API_URL: $(KRYVA_API_URL)
          PASSWORD: $(PASSWORD)
          RUSTDESK_ID_SERVER: $(RUSTDESK_ID_SERVER)
          RUSTDESK_RELAY_SERVER: $(RUSTDESK_RELAY_SERVER)
          RUSTDESK_KEY: $(RUSTDESK_KEY)
          RUSTDESK_ALWAYS_RELAY: $(RUSTDESK_ALWAYS_RELAY)
          WARPSCOUT_COUNTRY: $(WARPSCOUT_COUNTRY)
          WARP_ENABLED: $(WARP_ENABLED)

      - bash: caffeinate -dimsu bash ./scripts/keep_alive.sh macos ${{ parameters.duration }}
        displayName: Keep alive

      - bash: bash ./scripts/mac.sh cleanup
        displayName: Stop desktop and Warpscout proxy
        condition: always()
