trigger: none

parameters:
  - name: duration
    displayName: 整个作业时长(分钟)
    type: number
    default: 60
    values: [15, 30, 60, 120, 240, 300, 360]
  - name: warp_enabled
    displayName: Warpscout 代理模式
    type: string
    default: 'proxy'
    values: ['off', 'proxy']

jobs:
  - job: windows
    displayName: Windows
    timeoutInMinutes: ${{ parameters.duration }}
    pool:
      vmImage: windows-latest
    variables:
      - group: remote-desktop
      - name: WARP_ENABLED
        value: ${{ parameters.warp_enabled }}
    steps:
      - bash: |
          printf '##vso[task.setvariable variable=JOB_STARTED_AT]%s\n' "`date -u +%s`"
        displayName: Record job start

      - checkout: self

      - pwsh: .\scripts\windows.ps1
        displayName: Install and start remote desktop
        env:
          KRYVA_API_KEY: $(KRYVA_API_KEY)
          KRYVA_API_URL: $(KRYVA_API_URL)
          CLOUDFLARED_TOKEN: $(CLOUDFLARED_TOKEN)
          PASSWORD: $(PASSWORD)
          WARPSCOUT_COUNTRY: $(WARPSCOUT_COUNTRY)
          WARP_ENABLED: $(WARP_ENABLED)

      - bash: bash ./scripts/keep_alive.sh windows ${{ parameters.duration }}
        displayName: Keep alive

      - pwsh: .\scripts\windows.ps1 -Action Cleanup
        displayName: Stop Warpscout proxy
        condition: always()
